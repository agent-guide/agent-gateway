apiVersion: gateway.agw/v1alpha1
kind: GatewayBundle

# Optional coding-agent evaluation. This is not part of the credential-free
# first run: configure the workspace and authenticate the selected ACP adapter.
# Give the route key only to callers trusted with the workspace and its home.
agents:
  - id: coding-agent
    name: Coding Agent
    runtime:
      type: acp
      acp:
        # For OpenCode, use its per-Agent XDG environment from gateway.bundle.acp.yaml.
        launcher: codex
        cwd: /workspaces/coding-agent
        allowed_roots: [/workspaces/coding-agent]
        env:
          HOME: /workspaces/coding-agent/home
          CODEX_HOME: /workspaces/coding-agent/home/.codex
        max_instances: 2
        permission_mode: interactive
    routes: {}
    resources: {}
    policy: {}

agentRoutes:
  - id: coding-agent-turn
    protocol: at
    agent_id: coding-agent
    match_policy:
      path_prefix: /agents/coding
    auth_policy:
      require_virtual_key: true

virtualKeys:
  - id: coding-agent-key
    allowed_route_ids: [coding-agent-turn]
