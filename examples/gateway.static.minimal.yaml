apiVersion: gateway.agw/v1alpha1
kind: GatewayBundle

providers:
  - id: openai-main
    provider_type: openai
    api_key: ${OPENAI_API_KEY}
    default_model: gpt-4.1

providerModels:
  - provider_id: openai-main
    upstream_model: gpt-4.1
    enabled: true
    capability_overrides:
      streaming: true
      tools: true

llmRoutes:
  - id: chat-prod
    protocol: openai
    match_policy:
      path_prefix: /
      methods:
        - POST
    auth_policy:
      require_virtual_key: true
    target_policy:
      type: models
      default_model: gpt-4.1
      model_targets:
        - name: gpt-4.1
          kind: provider-model
          provider_id: openai-main
          upstream_model: gpt-4.1
