name: agent-gateway-first-run

services:
  gateway:
    image: ${AGW_GATEWAY_IMAGE:-ghcr.io/agent-guide/agent-gateway:v0.7.1}
    command:
      - agwd
      - --addr
      - 0.0.0.0:8080
      - --admin-addr
      - 127.0.0.1:8019
      - --config-store
      - /var/lib/agent-gateway/configstore.db
      - --metrics-otlp-endpoint
      - ${AGW_OTLP_ENDPOINT:-}
      - --metrics-otlp-insecure
      - --metrics-otlp-service-name
      - agent-gateway
    environment:
      AGW_ADMIN_BASIC_AUTH_HASH: ${AGW_ADMIN_BASIC_AUTH_HASH:?run ./setup.sh first}
    ports:
      - 127.0.0.1:8080:8080
    volumes:
      - gateway-data:/var/lib/agent-gateway
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  fixture:
    image: ${AGW_FIXTURE_IMAGE:-ghcr.io/agent-guide/agent-gateway-a2a-fixture:v0.7.1}
    network_mode: service:gateway
    depends_on:
      gateway:
        condition: service_started
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  init:
    image: ${AGW_GATEWAY_IMAGE:-ghcr.io/agent-guide/agent-gateway:v0.7.1}
    network_mode: service:gateway
    depends_on:
      gateway:
        condition: service_healthy
      fixture:
        condition: service_healthy
    environment:
      AGW_ADMIN_ADDR: http://127.0.0.1:8019
      AGW_ADMIN_BASIC_AUTH: ${AGW_ADMIN_BASIC_AUTH:?run ./setup.sh first}
    volumes:
      - ./gateway.bundle.yaml:/project/gateway.bundle.yaml:ro
      - ./init.sh:/project/init.sh:ro
    entrypoint: [/bin/sh, /project/init.sh]
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    profiles: [tools]

  smoke:
    image: ${AGW_GATEWAY_IMAGE:-ghcr.io/agent-guide/agent-gateway:v0.7.1}
    network_mode: service:gateway
    depends_on:
      gateway:
        condition: service_healthy
      fixture:
        condition: service_healthy
    environment:
      AGW_ADMIN_ADDR: http://127.0.0.1:8019
      AGW_ADMIN_BASIC_AUTH: ${AGW_ADMIN_BASIC_AUTH:?run ./setup.sh first}
    volumes:
      - ./smoke.sh:/project/smoke.sh:ro
    entrypoint: [/bin/sh, /project/smoke.sh]
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    profiles: [tools]

  prometheus:
    image: prom/prometheus:v3.14.0
    network_mode: service:gateway
    depends_on:
      gateway:
        condition: service_healthy
    command:
      - --config.file=/etc/prometheus/prometheus.yaml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=24h
      - --web.listen-address=127.0.0.1:9090
    volumes:
      - ./observability/prometheus.yaml:/etc/prometheus/prometheus.yaml:ro
      - prometheus-data:/prometheus
    secrets:
      - admin-password
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    profiles: [observability]

  tempo:
    image: grafana/tempo:3.1.0
    network_mode: service:gateway
    depends_on:
      gateway:
        condition: service_healthy
    command: [-config.file=/etc/tempo/tempo.yaml]
    volumes:
      - ./observability/tempo.yaml:/etc/tempo/tempo.yaml:ro
      - tempo-data:/var/tempo
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    profiles: [observability]

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.160.0
    network_mode: service:gateway
    depends_on:
      gateway:
        condition: service_healthy
      tempo:
        condition: service_started
    command: [--config=/etc/otelcol-contrib/config.yaml]
    volumes:
      - ./observability/otel-collector.yaml:/etc/otelcol-contrib/config.yaml:ro
    read_only: true
    profiles: [observability]

  grafana:
    image: grafana/grafana:13.2.0
    network_mode: service:gateway
    depends_on:
      prometheus:
        condition: service_started
      tempo:
        condition: service_started
    environment:
      GF_SERVER_HTTP_ADDR: 0.0.0.0
      GF_SERVER_HTTP_PORT: 3000
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    profiles: [observability]

volumes:
  gateway-data:
  prometheus-data:
  tempo-data:
  grafana-data:

secrets:
  admin-password:
    file: ./.admin-password
