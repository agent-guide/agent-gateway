apiVersion: 1

datasources:
  - name: Agent Gateway Prometheus
    uid: agent-gateway-prometheus
    type: prometheus
    access: proxy
    url: http://127.0.0.1:9090
    isDefault: true
    editable: false

  - name: Agent Gateway Tempo
    uid: agent-gateway-tempo
    type: tempo
    access: proxy
    url: http://127.0.0.1:3200
    editable: false
    jsonData:
      tracesToMetrics:
        datasourceUid: agent-gateway-prometheus
