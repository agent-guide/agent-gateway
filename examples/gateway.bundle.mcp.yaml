apiVersion: gateway.agw/v1alpha1
kind: GatewayBundle

# Configure MCP connectors through online Bundle apply:
# agwctl apply -f examples/gateway.bundle.mcp.yaml
# Set MCP_HTTP_URL and MCP_FILESYSTEM_ROOT before applying.
# MCP auth/env may contain secrets; keep exported Bundles private.
connectors:
  - id: mcp-http
    name: HTTP MCP connector
    type: mcp
    mcp:
      transport: streamable_http
      url: ${MCP_HTTP_URL}
      auth:
        type: api_key
        # api_key: ${MCP_HTTP_KEY}

  # Legacy SSE is another MCP transport:
  # - id: mcp-sse
  #   name: SSE MCP connector
  #   type: mcp
  #   mcp:
  #     transport: sse
  #     url: ${MCP_SSE_URL}

  - id: mcp-filesystem
    name: Filesystem MCP connector
    type: mcp
    mcp:
      transport: stdio
      command: npx
      args:
        - -y
        - "@modelcontextprotocol/server-filesystem"
        - ${MCP_FILESYSTEM_ROOT}
      env:
        NODE_ENV: production

mcpRoutes:
  - connector_id: mcp-http
    match_policy:
      path_prefix: /mcp/http
    auth_policy:
      require_virtual_key: true
  - connector_id: mcp-filesystem
    match_policy:
      path_prefix: /mcp/fs
    auth_policy:
      require_virtual_key: true

virtualKeys:
  - id: vk-mcp-test
    tag: local-test
    allowed_route_ids:
      - mcp:mcp-http:mcp-http
      - mcp:mcp-filesystem:mcp-fs
