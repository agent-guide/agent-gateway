apiVersion: gateway.agw/v1alpha1
kind: GatewayBundle

providers:
  - id: openai-main
    provider_type: openai
    api_key: ${OPENAI_API_KEY}
  - id: anthropic-main
    provider_type: anthropic
    api_key: ${ANTHROPIC_API_KEY}

# Concrete model facts. Discovery is explicit; overrides also work offline.
providerModels:
  - provider_id: openai-main
    upstream_model: gpt-4.1
    enabled: true
    capability_overrides:
      streaming: true
      tools: true
      vision: true
  - provider_id: anthropic-main
    upstream_model: claude-sonnet-4-5
    enabled: true
    capability_overrides:
      streaming: true
      tools: true
      vision: true

# Shared independently of route protocol, path, and authentication.
logicalModels:
  - id: chat-default
    strategy: priority
    fallback:
      enabled: true
      max_num: 1
    candidates:
      - provider_id: openai-main
        upstream_model: gpt-4.1
        priority: 100
      - provider_id: anthropic-main
        upstream_model: claude-sonnet-4-5
        priority: 50

llmRoutes:
  - id: chat-prod
    protocol: openai
    match_policy:
      path_prefix: /
      methods: [POST]
    auth_policy:
      require_virtual_key: true
    target_policy:
      type: models
      default_model: chat
      model_targets:
        - name: chat
          kind: logical-model
          logical_model_id: chat-default

virtualKeys:
  - id: vk-prod
    tag: prod
    allowed_route_ids: [chat-prod]
