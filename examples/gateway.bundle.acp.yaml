apiVersion: gateway.agw/v1alpha1
kind: GatewayBundle

# ACP bundle example — codex and opencode coding agents behind the gateway
#
# Apply with:
#   agwctl apply -f examples/gateway.bundle.acp.yaml
#
# Prerequisites:
#   - create each /workspaces/<agent-id> directory with its own home subdirectory
#   - the repository image includes `codex-acp` and `opencode`. For a binary
#     deployment, install the selected adapter on PATH.
#   - enable the OpenCode Agent and AgentRoute together
#   - sign in once per Agent with the same environment used by its runtime
#   - the gateway and adapters share an OS user. Give route keys only to
#     callers trusted with the workspace, including its credential files.
#
# runtime.acp.permission_mode is one of:
#   deny         — fail-closed default; agent permission requests are rejected
#   auto_approve — first "allow"-kind option is selected automatically
#   interactive  — requests surface as `permission` SSE events on the turn
#                  stream and resolve via POST /<agent-route>/permission or
#                  `agwctl agent decide`

agents:

  - id: codex-main
    name: Codex
    runtime:
      type: acp
      acp:
        launcher: codex
        cwd: /workspaces/codex-main
        allowed_roots: [/workspaces/codex-main]
        env:
          HOME: /workspaces/codex-main/home
          CODEX_HOME: /workspaces/codex-main/home/.codex
        max_instances: 4
        permission_mode: deny
    routes: {}
    resources: {}
    policy: {}

  # - id: opencode-main
  #   name: OpenCode
  #   runtime:
  #     type: acp
  #     acp:
  #       launcher: opencode
  #       cwd: /workspaces/opencode-main
  #       allowed_roots: [/workspaces/opencode-main]
  #       env:
  #         HOME: /workspaces/opencode-main/home
  #         XDG_CONFIG_HOME: /workspaces/opencode-main/home/.config
  #         XDG_DATA_HOME: /workspaces/opencode-main/home/.local/share
  #         XDG_STATE_HOME: /workspaces/opencode-main/home/.local/state
  #         XDG_CACHE_HOME: /workspaces/opencode-main/home/.cache
  #       max_instances: 4
  #       permission_mode: deny
  #   routes: {}
  #   resources: {}
  #   policy: {}

agentRoutes:

  # id defaults to the slash-free agent:<agent_id>:<path-slug> when omitted
  - id: agent-codex
    agent_id: codex-main
    match_policy:
      path_prefix: /acp/codex
    auth_policy:
      require_virtual_key: false

  # - id: agent-opencode
