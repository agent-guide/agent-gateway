name: Release

on:
  push:
    tags:
      - "v[0-9]*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing immutable preview tag to resume
        required: true
      source_run_id:
        description: Release run whose only failure was first-run packaging
        required: true
      gateway_digest:
        description: Verified gateway image digest (sha256:...)
        required: true
      fixture_digest:
        description: Verified fixture image digest (sha256:...)
        required: true

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  GATEWAY_IMAGE: ghcr.io/agent-guide/agent-gateway
  FIXTURE_IMAGE: ghcr.io/agent-guide/agent-gateway-a2a-fixture

jobs:
  preflight:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Validate tag and manifest identity
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          if [[ "$GITHUB_REF_NAME" != "v$version" ]] || ! [[ "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-preview\.[1-9][0-9]*)?$ ]]; then
            echo "Unsupported release tag: $GITHUB_REF_NAME" >&2
            exit 1
          fi
          prerelease=false
          if [[ "$version" == *-preview.* ]]; then
            prerelease=true
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"
          test -s "docs/releases/$GITHUB_REF_NAME.md"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          go run ./cmd/agwd manifest > "$RUNNER_TEMP/runtime-manifest.json"
          jq -e --arg version "$version" \
            '.edition.version == $version and all(.modules[]; .version == $version)' \
            "$RUNNER_TEMP/runtime-manifest.json"
          go run ./cmd/agwctl manifest > "$RUNNER_TEMP/validation-manifest.json"
          jq -e --arg version "$version" \
            '.edition.version == $version and all(.modules[]; .version == $version)' \
            "$RUNNER_TEMP/validation-manifest.json"
      - name: Verify source release gates
        run: make verify-release
      - name: Verify documentation, examples, and release-facing content
        run: make verify-adoption
      - name: Smoke source release processes
        run: make smoke-release
      - name: Verify immutable Community consumer candidate
        run: make test-extension-consumer-candidate COMMUNITY_COMMIT="$GITHUB_SHA"

  archives:
    needs: preflight
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            goos: linux
            goarch: amd64
          - runner: ubuntu-24.04-arm
            goos: linux
            goarch: arm64
          - runner: macos-15-intel
            goos: darwin
            goarch: amd64
          - runner: macos-15
            goos: darwin
            goarch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Build and execute archive verification
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: >-
          make verify-release-archive
          RELEASE_VERSION=${{ needs.preflight.outputs.version }}
          RELEASE_OUTPUT_DIR=dist
      - uses: actions/upload-artifact@v4
        with:
          name: release-archive-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*.tar.gz
          if-no-files-found: error
          retention-days: 7

  images:
    needs: preflight
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    outputs:
      gateway_digest: ${{ steps.gateway.outputs.digest }}
      fixture_digest: ${{ steps.fixture.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish versioned gateway image
        id: gateway
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.GATEWAY_IMAGE }}:${{ github.ref_name }}
            ${{ env.GATEWAY_IMAGE }}:sha-${{ github.sha }}
          build-args: |
            VERSION=${{ needs.preflight.outputs.version }}
            REVISION=${{ github.sha }}
          sbom: true
          provenance: mode=max
          cache-from: type=gha,scope=gateway-release
          cache-to: type=gha,mode=max,scope=gateway-release
      - name: Attest gateway image provenance
        uses: actions/attest@v4
        with:
          subject-name: ${{ env.GATEWAY_IMAGE }}
          subject-digest: ${{ steps.gateway.outputs.digest }}
          push-to-registry: true
      - name: Build and publish versioned fixture image
        id: fixture
        uses: docker/build-push-action@v6
        with:
          context: .
          file: examples/a2a-agent/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.FIXTURE_IMAGE }}:${{ github.ref_name }}
            ${{ env.FIXTURE_IMAGE }}:sha-${{ github.sha }}
          build-args: |
            VERSION=${{ needs.preflight.outputs.version }}
            REVISION=${{ github.sha }}
          sbom: true
          provenance: mode=max
          cache-from: type=gha,scope=fixture-release
          cache-to: type=gha,mode=max,scope=fixture-release
      - name: Attest fixture image provenance
        uses: actions/attest@v4
        with:
          subject-name: ${{ env.FIXTURE_IMAGE }}
          subject-digest: ${{ steps.fixture.outputs.digest }}
          push-to-registry: true

  public-images:
    needs: [preflight, images]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Verify both image digests are anonymously pullable
        env:
          GATEWAY_REF: ${{ env.GATEWAY_IMAGE }}@${{ needs.images.outputs.gateway_digest }}
          FIXTURE_REF: ${{ env.FIXTURE_IMAGE }}@${{ needs.images.outputs.fixture_digest }}
        shell: bash
        run: |
          set -euo pipefail
          check_public_image() {
            local ref=$1
            if docker pull "$ref"; then
              return
            fi
            echo "::error title=GHCR package is not public::$ref could not be pulled without registry credentials. New GHCR packages default to private; an agent-guide organization owner must change both release packages to Public and rerun the failed jobs."
            exit 1
          }
          check_public_image "$GATEWAY_REF"
          check_public_image "$FIXTURE_REF"

  image-smoke:
    needs: [preflight, images]
    name: Image smoke (${{ matrix.goarch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            goarch: amd64
          - runner: ubuntu-24.04-arm
            goarch: arm64
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Smoke immutable published images
        env:
          AGW_GATEWAY_IMAGE: ${{ env.GATEWAY_IMAGE }}@${{ needs.images.outputs.gateway_digest }}
          AGW_FIXTURE_IMAGE: ${{ env.FIXTURE_IMAGE }}@${{ needs.images.outputs.fixture_digest }}
        run: ./scripts/smoke-container "${{ needs.preflight.outputs.version }}"

  image-scan:
    needs: [preflight, images]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Scan gateway image
        id: gateway_scan
        continue-on-error: true
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.GATEWAY_IMAGE }}@${{ needs.images.outputs.gateway_digest }}
          format: json
          output: gateway-trivy.json
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
      - name: Scan fixture image
        id: fixture_scan
        continue-on-error: true
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.FIXTURE_IMAGE }}@${{ needs.images.outputs.fixture_digest }}
          format: json
          output: fixture-trivy.json
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-image-scans
          path: "*-trivy.json"
          if-no-files-found: error
          retention-days: 30
      - name: Enforce vulnerability gate
        if: always()
        env:
          GATEWAY_OUTCOME: ${{ steps.gateway_scan.outcome }}
          FIXTURE_OUTCOME: ${{ steps.fixture_scan.outcome }}
        run: test "$GATEWAY_OUTCOME" = success && test "$FIXTURE_OUTCOME" = success

  source-sbom:
    needs: preflight
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Materialize exact tagged source
        run: |
          mkdir -p "$RUNNER_TEMP/tag-source" dist
          git archive --format=tar "$GITHUB_SHA" | tar -x -C "$RUNNER_TEMP/tag-source"
      - name: Generate SPDX JSON SBOM
        uses: anchore/sbom-action@v0.24.0
        with:
          path: ${{ runner.temp }}/tag-source
          format: spdx-json
          output-file: dist/agent-gateway-source-v${{ needs.preflight.outputs.version }}.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - uses: actions/upload-artifact@v4
        with:
          name: release-source-sbom
          path: dist/*.spdx.json
          if-no-files-found: error
          retention-days: 7

  first-run:
    needs: [preflight, images, public-images, image-smoke, image-scan]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Package and verify digest-pinned first-run asset
        env:
          GATEWAY_IMAGE_REF: ${{ env.GATEWAY_IMAGE }}@${{ needs.images.outputs.gateway_digest }}
          FIXTURE_IMAGE_REF: ${{ env.FIXTURE_IMAGE }}@${{ needs.images.outputs.fixture_digest }}
        run: >-
          make verify-first-run-archive
          RELEASE_VERSION=${{ needs.preflight.outputs.version }}
          RELEASE_OUTPUT_DIR=dist
          GATEWAY_IMAGE_REF="$GATEWAY_IMAGE_REF"
          FIXTURE_IMAGE_REF="$FIXTURE_IMAGE_REF"
      - name: Execute first-run archive outside the checkout
        env:
          AGW_FIRST_RUN_ARCHIVE: ${{ github.workspace }}/dist/agent-gateway-first-run-v${{ needs.preflight.outputs.version }}.tar.gz
          AGW_GATEWAY_IMAGE: ${{ env.GATEWAY_IMAGE }}@${{ needs.images.outputs.gateway_digest }}
          AGW_FIXTURE_IMAGE: ${{ env.FIXTURE_IMAGE }}@${{ needs.images.outputs.fixture_digest }}
        run: ./scripts/smoke-first-run "${{ needs.preflight.outputs.version }}"
      - uses: actions/upload-artifact@v4
        with:
          name: release-first-run
          path: dist/*.tar.gz
          if-no-files-found: error
          retention-days: 7

  publish-release:
    needs: [preflight, archives, images, public-images, image-smoke, image-scan, source-sbom, first-run]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: release-archive-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: release-first-run
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: release-source-sbom
          path: dist
      - name: Generate and verify release checksums
        shell: bash
        run: |
          set -euo pipefail
          test "$(find dist -maxdepth 1 -name '*.tar.gz' -type f | wc -l | tr -d ' ')" = 5
          (cd dist && find . -maxdepth 1 -name '*.tar.gz' -type f -print \
            | sed 's|^./||' | LC_ALL=C sort | xargs sha256sum) > dist/SHA256SUMS
          (cd dist && sha256sum -c SHA256SUMS)
      - name: Attest release archive provenance
        uses: actions/attest@v4
        with:
          subject-checksums: dist/SHA256SUMS
      - name: Attest source SBOM provenance
        uses: actions/attest@v4
        with:
          subject-path: dist/*.spdx.json
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          body_path: docs/releases/${{ github.ref_name }}.md
          prerelease: ${{ needs.preflight.outputs.prerelease == 'true' }}
          make_latest: ${{ needs.preflight.outputs.prerelease == 'true' && 'false' || 'true' }}
          files: |
            dist/*.tar.gz
            dist/*.spdx.json
            dist/SHA256SUMS
          fail_on_unmatched_files: true

  post-publish:
    needs: [preflight, images, publish-release]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Download and verify public release assets
        run: |
          mkdir -p "$RUNNER_TEMP/public-release"
          gh release download "$GITHUB_REF_NAME" --dir "$RUNNER_TEMP/public-release"
          cd "$RUNNER_TEMP/public-release"
          sha256sum -c SHA256SUMS
      - name: Execute the public first-run asset without registry credentials
        env:
          AGW_FIRST_RUN_ARCHIVE: ${{ runner.temp }}/public-release/agent-gateway-first-run-v${{ needs.preflight.outputs.version }}.tar.gz
          AGW_GATEWAY_IMAGE: ${{ env.GATEWAY_IMAGE }}@${{ needs.images.outputs.gateway_digest }}
          AGW_FIXTURE_IMAGE: ${{ env.FIXTURE_IMAGE }}@${{ needs.images.outputs.fixture_digest }}
        run: ./scripts/smoke-first-run "${{ needs.preflight.outputs.version }}"

  promote-latest:
    needs: [preflight, images, post-publish]
    if: needs.preflight.outputs.prerelease == 'false'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Move latest to verified image digests
        run: |
          docker buildx imagetools create \
            --tag "${GATEWAY_IMAGE}:latest" \
            "${GATEWAY_IMAGE}@${{ needs.images.outputs.gateway_digest }}"
          docker buildx imagetools create \
            --tag "${FIXTURE_IMAGE}:latest" \
            "${FIXTURE_IMAGE}@${{ needs.images.outputs.fixture_digest }}"

  resume-preview:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ inputs.tag }}
      SOURCE_RUN_ID: ${{ inputs.source_run_id }}
      GATEWAY_REF: ghcr.io/agent-guide/agent-gateway@${{ inputs.gateway_digest }}
      FIXTURE_REF: ghcr.io/agent-guide/agent-gateway-a2a-fixture@${{ inputs.fixture_digest }}
    steps:
      # Keep runtime source and all existing artifacts on the original tag.
      # Only packaging tools come from the dispatch revision.
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ inputs.tag }}
          path: .release-source
      - uses: actions/setup-go@v5
        with:
          go-version-file: .release-source/go.mod
          cache-dependency-path: .release-source/go.sum
          cache: true
      - name: Validate immutable source and successful prior gates
        id: source
        shell: bash
        run: |
          set -euo pipefail
          if ! [[ "$SOURCE_RUN_ID" =~ ^[0-9]+$ ]]; then exit 1; fi
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID" > "$RUNNER_TEMP/source-run.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID/jobs?per_page=100" > "$RUNNER_TEMP/source-jobs.json"
          python3 scripts/verify-preview-resume.py \
            "$RUNNER_TEMP/source-run.json" "$RUNNER_TEMP/source-jobs.json" \
            "$RELEASE_TAG" "$(git -C .release-source rev-parse HEAD)" \
            "$GATEWAY_REF" "$FIXTURE_REF" >> "$GITHUB_OUTPUT"
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release already exists; refusing to replace published assets" >&2
            exit 1
          fi
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.source_run_id }}
          pattern: release-archive-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.source_run_id }}
          name: release-source-sbom
          path: dist
      - uses: docker/setup-buildx-action@v3
      - name: Verify unchanged public images
        shell: bash
        env:
          SOURCE_COMMIT: ${{ steps.source.outputs.source_commit }}
          VERSION: ${{ steps.source.outputs.version }}
        run: |
          set -euo pipefail
          test "$(docker buildx imagetools inspect "$GATEWAY_IMAGE:$RELEASE_TAG" --format '{{.Manifest.Digest}}')" = "${GATEWAY_REF##*@}"
          test "$(docker buildx imagetools inspect "$FIXTURE_IMAGE:$RELEASE_TAG" --format '{{.Manifest.Digest}}')" = "${FIXTURE_REF##*@}"
          for ref in "$GATEWAY_REF" "$FIXTURE_REF"; do
            docker pull "$ref"
            test "$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$ref")" = "$SOURCE_COMMIT"
            test "$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.version" }}' "$ref")" = "$VERSION"
          done
      - name: Package and verify first-run from tagged source
        env:
          AGW_RELEASE_SOURCE_DIR: ${{ github.workspace }}/.release-source
          VERSION: ${{ steps.source.outputs.version }}
        run: |
          ./scripts/package-first-run "$VERSION" "$GATEWAY_REF" "$FIXTURE_REF" dist
          .release-source/scripts/verify-first-run-archive \
            "dist/agent-gateway-first-run-v$VERSION.tar.gz" "$VERSION" "$GATEWAY_REF" "$FIXTURE_REF"
      - name: Execute recovered first-run archive outside the checkout
        env:
          AGW_FIRST_RUN_ARCHIVE: ${{ github.workspace }}/dist/agent-gateway-first-run-v${{ steps.source.outputs.version }}.tar.gz
          AGW_GATEWAY_IMAGE: ${{ env.GATEWAY_REF }}
          AGW_FIXTURE_IMAGE: ${{ env.FIXTURE_REF }}
        run: .release-source/scripts/smoke-first-run "${{ steps.source.outputs.version }}"
      - name: Verify archive identities and generate checksums
        env:
          SOURCE_COMMIT: ${{ steps.source.outputs.source_commit }}
          VERSION: ${{ steps.source.outputs.version }}
        run: |
          python3 - <<'PY'
          import json, os, pathlib, tarfile
          version = os.environ['VERSION']
          for target in ('linux-amd64', 'linux-arm64', 'darwin-amd64', 'darwin-arm64'):
              name = f'agent-gateway-v{version}-{target}'
              with tarfile.open(f'dist/{name}.tar.gz') as archive:
                  metadata = json.load(archive.extractfile(f'{name}/RELEASE-METADATA.json'))
              assert metadata['version'] == version
              assert metadata['source_commit'] == os.environ['SOURCE_COMMIT']
              assert metadata['target'] == dict(zip(('os', 'arch'), target.split('-')))
          assert len(list(pathlib.Path('dist').glob('*.tar.gz'))) == 5
          assert len(list(pathlib.Path('dist').glob('*.spdx.json'))) == 1
          PY
          (cd dist && find . -maxdepth 1 -name '*.tar.gz' -type f -print \
            | sed 's|^./||' | LC_ALL=C sort | xargs sha256sum) > dist/SHA256SUMS
          (cd dist && sha256sum -c SHA256SUMS)
          cp ".release-source/docs/releases/$RELEASE_TAG.md" "$RUNNER_TEMP/release-notes.md"
          printf '\nPublication resumed from [verified source run](https://github.com/%s/actions/runs/%s) with [packaging tools](https://github.com/%s/commit/%s). The original tag and runtime artifacts are unchanged.\n' \
            "$GITHUB_REPOSITORY" "$SOURCE_RUN_ID" "$GITHUB_REPOSITORY" "$GITHUB_SHA" >> "$RUNNER_TEMP/release-notes.md"
      - uses: actions/attest@v4
        with:
          subject-checksums: dist/SHA256SUMS
      - uses: actions/attest@v4
        with:
          subject-path: dist/*.spdx.json
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          body_path: ${{ runner.temp }}/release-notes.md
          prerelease: true
          make_latest: "false"
          files: |
            dist/*.tar.gz
            dist/*.spdx.json
            dist/SHA256SUMS
          fail_on_unmatched_files: true
      - name: Verify public release and replay first-run anonymously
        env:
          VERSION: ${{ steps.source.outputs.version }}
          AGW_GATEWAY_IMAGE: ${{ env.GATEWAY_REF }}
          AGW_FIXTURE_IMAGE: ${{ env.FIXTURE_REF }}
        run: |
          gh release download "$RELEASE_TAG" --dir "$RUNNER_TEMP/public-release"
          (cd "$RUNNER_TEMP/public-release" && sha256sum -c SHA256SUMS)
          AGW_FIRST_RUN_ARCHIVE="$RUNNER_TEMP/public-release/agent-gateway-first-run-v$VERSION.tar.gz" \
            .release-source/scripts/smoke-first-run "$VERSION"
